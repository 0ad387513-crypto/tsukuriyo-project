<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ロード画面・休憩中のカミ</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
    body { margin: 0; color: #f2ead8; background: #10121d; }
    header, main { max-width: 1200px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    header p { color: #c8bed0; line-height: 1.65; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding-top: 0; }
    figure { margin: 0; padding: 16px; text-align: center; background: linear-gradient(145deg, #292538, #171b2a); border: 1px solid #86744e; border-radius: 14px; }
    img { display: block; width: 100%; height: 230px; object-fit: contain; }
    figcaption { margin-top: 10px; font-size: 1rem; color: #efdbab; }
    small { display: block; margin-top: 4px; color: #c8bed0; font-size: .85rem; }
    @media (max-width: 700px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px; } figure { padding: 8px; } img { height: 160px; } }
  </style>
</head>
<body>
  <header><h1>休憩中のカミ・ロード画面</h1><p>ヤマタノオロチを除く9柱の差分です。画像は透明背景のWebPへ軽量化し、ロード画面に組み込みました。</p></header>
  <main>
    <figure><img src="susanoo-rest-c8d7dafddecd.webp" alt="おにぎりを豪快に食べるスサノオ"><figcaption>スサノオ<small>腹が減っては戦えぬ！</small></figcaption></figure>
    <figure><img src="yamato-takeru-rest-1a579987af7b.webp" alt="一人で盆栽の手入れをするヤマトタケル"><figcaption>ヤマトタケル<small>一人で盆栽の手入れ</small></figcaption></figure>
    <figure><img src="okuninushi-rest-077817e82a0e.webp" alt="白兎に団子を全部食べられたオオクニヌシ"><figcaption>オオクニヌシ<small>私の団子は……？</small></figcaption></figure>
    <figure><img src="takemikazuchi-rest-fc71fcd56c88.webp" alt="木人で修行するタケミカヅチ"><figcaption>タケミカヅチ<small>今日も全力で修行中</small></figcaption></figure>
    <figure><img src="omoikane-rest-5459d8e24381.webp" alt="巻物の山から這い出すオモイカネ"><figcaption>オモイカネ<small>巻物の山から脱出中</small></figcaption></figure>
    <figure><img src="amenouzume-rest-8cd886a79256.webp" alt="目の描かれたアイマスクで眠るアメノウズメ"><figcaption>アメノウズメ<small>寝て……いない？</small></figcaption></figure>
    <figure><img src="hinokagutsuchi-rest-9a3bc9d78c0b.webp" alt="お餅を焼くヒノカグツチ"><figcaption>ヒノカグツチ<small>炎でおやつをひと焼き</small></figcaption></figure>
    <figure><img src="amaterasu-rest-c8488a613337.webp" alt="お茶とお菓子を楽しむアマテラス"><figcaption>アマテラス<small>お茶とお菓子でひと息</small></figcaption></figure>
    <figure><img src="tsukuyomi-rest-cd32de2b7937.webp" alt="虚空を見つめてぼんやりするツクヨミ"><figcaption>ツクヨミ<small>……</small></figcaption></figure>
  </main>
</body>
</html>
