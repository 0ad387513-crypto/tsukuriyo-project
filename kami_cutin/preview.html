<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>創世神技カットイン確認</title><link rel="stylesheet" href="../divine_effects.css">
<style>body{margin:0;background:#090b15;color:#e8dfcf;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{padding:9px 12px;border:1px solid #765e35;border-radius:6px;background:#201e28;color:#f5dda0;cursor:pointer}button.active{background:#715729;color:white}.stage{position:relative;height:min(72vh,760px);overflow:hidden;border:1px solid #765e35;background:radial-gradient(ellipse,#252232,#050710)}.divine-art{position:absolute;inset:0}.caption{position:absolute;bottom:20px;left:10%;right:10%;text-align:center;color:#ffe6a2;font-size:20px;font-weight:bold;z-index:5;text-shadow:0 2px 6px black}.portrait{display:block;margin:auto;height:88%;max-width:100%;object-fit:contain}.note{font-size:14px;color:#b3b8c9}</style>
<main id="viewer"><h1>創世神技カットイン確認</h1><p class="note">カミを選んで「演出を再生」。対戦と同じ専用画像・エフェクトです。</p><nav><button v-for="(name,i) in names" :class="{active:no===i+1}" @click="select(i+1)">{{name}}</button></nav><button @click="replay">演出を再生</button><button @click="still=true">画像を確認</button><div class="stage"><img v-if="still" class="portrait" :src="theme.cutin" :alt="names[no-1]"><divine-skill-art v-else :key="serial" :effect="theme" :duration="5000"></divine-skill-art><div class="caption">{{names[no-1]}} · {{theme.label}}</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script><script src="../divine_effects.js"></script><script>new Vue({el:'#viewer',data:{no:1,serial:0,still:true,names:['スサノオ','ヤマトタケル','オオクニヌシ','タケミカヅチ','オモイカネ','アメノウズメ','ヒノカグツチ','アマテラス','ツクヨミ','ヤマタノオロチ']},computed:{theme(){const t=divineSkillTheme({no:this.no},2);return Object.assign({},t,{cutin:'../'+t.cutin})}},methods:{select(no){this.no=no;this.still=true;this.serial++},replay(){this.still=false;this.serial++}}});</script>
</html>
