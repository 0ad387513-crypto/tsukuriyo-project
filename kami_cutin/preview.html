<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/">
<title>創世神技カットイン確認</title><link rel="stylesheet" href="divine_effects.css">
<style>
body{margin:0;background:#090b15;color:#e8dfcf;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{padding:9px 12px;border:1px solid #765e35;border-radius:6px;background:#201e28;color:#f5dda0;cursor:pointer}button.active{background:#715729;color:white}.stage{height:min(72vh,760px);overflow:hidden;border:1px solid #765e35;background:#050710}.portrait{display:block;margin:auto;height:100%;max-width:100%;object-fit:contain}.note{font-size:14px;color:#b3b8c9}.preview-battle{position:fixed;inset:0;background:radial-gradient(ellipse,#302c3a,#0c0e19);z-index:50}.preview-field{position:absolute;left:8%;width:84%;height:25%;border:1px solid #a59b784d;border-radius:10px;background:#16192266}.enemy-field{top:21%}.friendly-field{top:52%}.preview-kami{position:absolute;left:calc(50% - 38px);width:76px;height:88px;border:2px solid #c5a56c;background:#201620;border-radius:8px}.preview-kami.self{bottom:25px}.preview-kami.opp{top:25px}.preview-kami img{width:100%;height:100%;object-fit:cover}.preview-battle .kami-susanoo-mark{cursor:default}.preview-overlay{position:fixed;inset:0;z-index:60;background:#050711f2}.preview-overlay.effect{background:#05071188}.preview-overlay.effect.storm{background:transparent}.preview-controls{position:fixed;right:12px;top:12px;z-index:80;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:90vw}.preview-controls button{background:#111622e8}.preview-effect-name{position:absolute;bottom:15%;width:100%;text-align:center;color:#ffe6a2;font-size:20px;font-weight:bold;text-shadow:0 2px 6px black}
 .preview-selected-legacy{position:fixed;display:grid;place-items:center;border:2px solid #c5a56c;border-radius:8px;background:linear-gradient(140deg,#585066,#262338);color:#f5dda0;font-size:15px;text-align:center;box-shadow:0 4px 18px #0008}
</style>
<main id="viewer">
<h1>創世神技カットイン確認</h1><p class="note">全画面カットイン → 台詞 → 固有演出の順に再生。スサノオは台詞の後に顔へ寄り、開眼します。対戦と同じ画像・エフェクトを使用します。ここでは音声を再生せず、カットインを3秒表示します。</p>
<nav><button v-for="(name,i) in names" :key="i" :class="{active:no===i+1}" @click="select(i+1)">{{name}}</button></nav>
<button @click="replay">演出を再生</button><button @click="inspect">カットインを全画面で確認</button><button v-if="theme.awakening" @click="inspectAwakening">開眼演出を確認</button><button @click="writer=writer==='self'?'opp':'self'">発動する側：{{writer==='self'?'自分':'相手'}}</button>
<button v-if="no===7" @click="flameSlot=(flameSlot+1)%3">選ぶレガシーの位置：{{['左','中央','右'][flameSlot]}}</button>
<div class="stage"><img class="portrait" :src="theme.cutin" :alt="names[no-1]"></div>
<div v-if="playing" class="preview-battle">
<div class="preview-field enemy-field"></div><div class="preview-field friendly-field"></div>
<div v-for="side in ['self','opp']" :key="side" class="preview-kami" :class="side"><img :src="theme.cutin" alt="カミの位置"><div v-if="no===1 && side===writer" class="kami-susanoo-mark" :class="{'susanoo-mark-pending':phase}"><divine-sprite name="kusanagi"></divine-sprite></div></div>
<div v-if="no===7 && phase==='closeup' && flameTargets.length" class="preview-selected-legacy" :style="{left:flameTargets[0].left+'px',top:flameTargets[0].top+'px',width:flameTargets[0].width+'px',height:flameTargets[0].height+'px'}">選んだ<br>レガシー</div>
<div v-if="phase" class="preview-overlay" :class="{effect:phase==='closeup',storm:no===1}">
<divine-skill-art :key="serial+'-'+phase" :stage="phase" :effect="theme" :layout="layout" :targets="flameTargets" :sword-landing="swordLanding" :duration="duration"></divine-skill-art>
<div v-if="phase==='cutin'" class="genesis-cutin-copy"><div class="genesis-cutin-name">{{theme.label}}</div><div class="genesis-cutin-kami">{{names[no-1]}}</div><div class="genesis-cutin-line">対戦では台詞とボイスの終了まで表示</div></div>
<div v-else-if="phase==='closeup'" class="preview-effect-name">{{theme.label}}</div>
</div>
<div class="preview-controls"><button v-if="phase==='cutin'" @click="pause">カットインを止めて確認</button><button v-if="phase==='cutin' && theme.awakening" @click="awakening">開眼演出へ</button><button v-if="phase==='awakening'" @click="freezeAwakening">開眼後を止めて確認</button><button v-if="phase==='cutin' || phase==='awakening'" @click="effects">固有演出へ</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.22)">斬撃を止めて確認</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects()">炎の演出を止めて確認</button><button @click="close">確認を閉じる</button></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script><script src="divine_effects.js"></script>
<script>
new Vue({el:'#viewer',data:{no:1,serial:0,playing:false,phase:null,writer:'self',layout:null,swordLanding:null,flameSlot:1,flameTargets:[],names:['スサノオ','ヤマトタケル','オオクニヌシ','タケミカヅチ','オモイカネ','アメノウズメ','ヒノカグツチ','アマテラス','ツクヨミ','ヤマタノオロチ']},computed:{theme(){return divineSkillTheme({no:this.no},2)},duration(){return this.phase==='awakening'?3000:this.no===10?4200:2400}},methods:{
select(no){this.close();this.no=no},pause(){clearTimeout(this._timer)},close(){this.pause();this.playing=false;this.phase=null},inspect(){this.replay();this.pause()},replay(){this.pause();this.serial++;this.playing=true;this.phase='cutin';this._timer=setTimeout(()=>this.theme.awakening?this.awakening():this.effects(),3000)},
awakening(){this.pause();this.phase='awakening';this._timer=setTimeout(()=>this.effects(),3000)},inspectAwakening(){this.pause();this.serial++;this.playing=true;this.phase='awakening'},freezeAwakening(){this.pause();this.$el.querySelectorAll('.susanoo-awakening-scene *').forEach(el=>el.getAnimations().forEach(a=>a.finish()))},
freezeEffects(progress=.45){this.pause();this.$el.querySelectorAll('.flame-target-scene, .flame-target-scene *').forEach(el=>el.getAnimations().forEach(a=>{a.currentTime=this.duration*progress;a.pause()}))},
effects(){this.pause();const rect=e=>{const r=e.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height}};const a=rect(this.$el.querySelector('.preview-kami.'+this.writer));this.layout={origin:{x:a.left+a.width/2,y:a.top+a.height/2},enemy:rect(this.$el.querySelector(this.writer==='self'?'.enemy-field':'.friendly-field')),friendly:rect(this.$el.querySelector(this.writer==='self'?'.friendly-field':'.enemy-field'))};const badge=this.$el.querySelector('.preview-kami.'+this.writer+' .kami-susanoo-mark');this.swordLanding=badge?rect(badge):null;this.flameTargets=[];
if(this.no===7){const field=this.layout.enemy,w=Math.min(100,field.width*.18),h=Math.min(135,field.height*.85);this.flameTargets=[{left:field.left+field.width*[.2,.5,.8][this.flameSlot]-w/2,top:field.top+(field.height-h)/2,width:w,height:h,kind:'card'},Object.assign(rect(this.$el.querySelector('.preview-kami.'+(this.writer==='self'?'opp':'self'))),{kind:'kami'})];}
this.phase='closeup';this._timer=setTimeout(()=>{this.phase=null},this.duration)}
}});
</script></html>
