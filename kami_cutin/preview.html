<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><script>const previewPath=location.pathname;if(previewPath.endsWith('/kami_cutin/preview.html'))document.querySelector('base').href=previewPath.slice(0,-'/kami_cutin/preview.html'.length)+'/';</script>
<title>創世神技カットイン確認</title><link rel="stylesheet" href="divine_effects.css">
<style>
body{margin:0;background:#090b15;color:#e8dfcf;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{padding:9px 12px;border:1px solid #765e35;border-radius:6px;background:#201e28;color:#f5dda0;cursor:pointer}button.active{background:#715729;color:white}.stage{height:min(72vh,760px);overflow:hidden;border:1px solid #765e35;background:#050710}.portrait{display:block;margin:auto;height:100%;max-width:100%;object-fit:contain}.note{font-size:14px;color:#b3b8c9}.preview-battle{position:fixed;inset:0;background:radial-gradient(ellipse,#302c3a,#0c0e19);z-index:50}.preview-field{position:absolute;left:8%;width:84%;height:25%;border:1px solid #a59b784d;border-radius:10px;background:#16192266}.enemy-field{top:21%}.friendly-field{top:52%}.preview-kami{position:absolute;left:calc(50% - 38px);width:76px;height:88px;border:2px solid #c5a56c;background:#201620;border-radius:8px}.preview-kami.self{bottom:25px}.preview-kami.opp{top:25px}.preview-kami img{width:100%;height:100%;object-fit:cover}.preview-battle .kami-susanoo-mark{cursor:default}.preview-overlay{position:fixed;inset:0;z-index:60;background:#050711f2}.preview-overlay.effect{background:#05071188}.preview-overlay.effect.storm{background:transparent}.preview-controls{position:fixed;right:12px;top:12px;z-index:80;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:90vw}.preview-controls button{background:#111622e8}.preview-effect-name{position:absolute;bottom:15%;width:100%;text-align:center;color:#ffe6a2;font-size:20px;font-weight:bold;text-shadow:0 2px 6px black}
 .preview-selected-legacy{position:fixed;display:grid;place-items:center;border:2px solid #c5a56c;border-radius:8px;background:#262338 url('card_images/600/001.webp') center/cover no-repeat;color:#f5dda0;font-size:15px;text-align:center;box-shadow:0 4px 18px #0008}
.preview-overlay.arrival{background:transparent}
</style>
<main id="viewer">
<h1>創世神技カットイン確認</h1><p class="note">全画面カットイン → 台詞 → 固有演出の順に再生。スサノオは台詞の後に顔へ寄り、開眼します。対戦と同じ画像・エフェクトを使用します。カットインは3秒表示し、カミのボイスは再生しません。ヤマタノオロチは龍の咆哮後、八枚の札がカミアイコン横の印になります。</p>
<nav><button v-for="(name,i) in names" :key="i" :class="{active:no===i+1}" @click="select(i+1)">{{name}}</button></nav>
<button @click="replay">演出を再生</button><button @click="inspect">カットインを全画面で確認</button><button v-if="theme.awakening" @click="inspectAwakening">開眼演出を確認</button><button @click="writer=writer==='self'?'opp':'self'">発動する側：{{writer==='self'?'自分':'相手'}}</button>
<button v-if="no===7" @click="flameSlot=(flameSlot+1)%3">選ぶレガシーの位置：{{['左','中央','右'][flameSlot]}}</button>
<div class="stage"><img class="portrait" :src="theme.cutin" :alt="names[no-1]"></div>
<div v-if="playing" class="preview-battle">
<div class="preview-field enemy-field"></div><div class="preview-field friendly-field"></div>
<div v-for="side in ['self','opp']" :key="side" class="preview-kami" :class="side"><img :src="theme.cutin" alt="カミの位置"><div v-if="no===1 && side===writer" class="kami-susanoo-mark" :class="{'susanoo-mark-pending':phase}"><divine-sprite name="kusanagi"></divine-sprite></div><div v-if="no===10 && side===writer" class="kami-orochi-mark" :class="{'orochi-mark-pending':phase}"><img src="divine_assets/orochi-torn-seal-29d8da98451b.webp" alt=""></div></div>
<div v-if="no===7 && phase==='closeup' && flameTargets.length && !flameCaptured" class="preview-selected-legacy" :style="{left:flameTargets[0].left+'px',top:flameTargets[0].top+'px',width:flameTargets[0].width+'px',height:flameTargets[0].height+'px'}"></div>
<div v-if="phase" class="preview-overlay" :class="{effect:phase==='closeup',arrival:phase==='sealArrival',storm:no===1}">
<divine-skill-art v-if="phase!=='sealArrival'" :key="serial+'-'+phase" :stage="phase" :effect="theme" :layout="layout" :targets="flameTargets" :sword-landing="swordLanding" :duration="duration"></divine-skill-art>
<divine-orochi-seal-arrival v-else :landing="sealLanding" :duration="1200"></divine-orochi-seal-arrival>
<div v-if="phase==='cutin'" class="genesis-cutin-copy"><div class="genesis-cutin-name">{{theme.label}}</div><div class="genesis-cutin-kami">{{names[no-1]}}</div><div class="genesis-cutin-line">対戦では台詞とボイスの終了まで表示</div></div>
<div v-else-if="phase==='closeup'" class="preview-effect-name">{{theme.label}}</div>
</div>
<div class="preview-controls"><button v-if="phase==='cutin'" @click="pause">カットインを止めて確認</button><button v-if="phase==='cutin' && theme.awakening" @click="awakening">開眼演出へ</button><button v-if="phase==='awakening'" @click="freezeAwakening">開眼後を止めて確認</button><button v-if="phase==='cutin' || phase==='awakening'" @click="effects">固有演出へ</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.24)">斬撃と消滅</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.42)">レガシー破壊後</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.57)">爆発初期</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.69)">炎の渦</button><button v-if="no===7 && phase==='closeup'" @click="freezeEffects(.89)">残り火</button><button v-if="no===10 && phase==='closeup'" @click="freezeEffects(.13)">八枚の封印</button><button v-if="no===10 && phase==='closeup'" @click="freezeEffects(.44)">少女の輪郭</button><button v-if="no===10 && phase==='closeup'" @click="freezeEffects(.68)">少女の全容</button><button v-if="no===10 && phase==='closeup'" @click="freezeEffects(.89)">咆哮と八頭の龍</button><button v-if="no===10 && phase==='closeup'" @click="testRoar">龍の鳴き声を聞く</button><button @click="close">確認を閉じる</button></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script><script src="divine_effects.js"></script>
<script>
 new Vue({el:'#viewer',data:{no:1,serial:0,playing:false,phase:null,writer:'self',layout:null,swordLanding:null,sealLanding:null,flameSlot:1,flameTargets:[],flameCaptured:false,names:['スサノオ','ヤマトタケル','オオクニヌシ','タケミカヅチ','オモイカネ','アメノウズメ','ヒノカグツチ','アマテラス','ツクヨミ','ヤマタノオロチ']},computed:{theme(){return divineSkillTheme({no:this.no},2)},duration(){return this.phase==='awakening'?3000:this.no===7?4300:(this.no===10||this.no===6)?4200:2400}},methods:{
select(no){this.close();this.no=no},pause(stopSound=true){clearTimeout(this._timer);clearTimeout(this._captureT);clearTimeout(this._soundTimer);if(stopSound){if(this._sound)this._sound.pause();this._sound=null;this._roarAudio=null}},close(){this.pause();this.playing=false;this.phase=null},inspect(){this.replay();this.pause()},replay(){this.pause();this.serial++;this.playing=true;this.phase='cutin';this._timer=setTimeout(()=>this.theme.awakening?this.awakening():this.effects(),3000)},
testRoar(){if(this._sound)this._sound.pause();const sound=this._roarAudio||new Audio('sfx/dragon_heavy.mp3');this._roarAudio=null;sound.volume=.24;sound.onended=()=>{if(this._sound===sound)this._sound=null};this._sound=sound;sound.play().catch(()=>{})},
awakening(){this.pause();this.phase='awakening';this._timer=setTimeout(()=>this.effects(),3000)},inspectAwakening(){this.pause();this.serial++;this.playing=true;this.phase='awakening'},freezeAwakening(){this.pause();this.$el.querySelectorAll('.susanoo-awakening-scene *').forEach(el=>el.getAnimations().forEach(a=>a.finish()))},
freezeEffects(progress=.45){this.pause();if(this.no===7)this.flameCaptured=progress>=.3;this.$el.querySelectorAll('.flame-target-scene, .flame-target-scene *, .divine-dragon .divine-scene, .divine-dragon .divine-scene *').forEach(el=>el.getAnimations().forEach(a=>{a.currentTime=this.duration*progress;a.pause()}))},
sealArrival(){this.pause(false);const badge=this.$el.querySelector('.preview-kami.'+this.writer+' .kami-orochi-mark');if(!badge){this.phase=null;return}const r=badge.getBoundingClientRect();this.sealLanding={left:r.left,top:r.top,width:r.width,height:r.height};this.phase='sealArrival';this._timer=setTimeout(()=>{this.phase=null},1200)},
effects(){this.pause();if(this.no===10){this._roarAudio=new Audio('sfx/dragon_heavy.mp3');this._roarAudio.preload='auto';this._roarAudio.load()}this.flameCaptured=false;const rect=e=>{const r=e.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height}};const a=rect(this.$el.querySelector('.preview-kami.'+this.writer));this.layout={origin:{x:a.left+a.width/2,y:a.top+a.height/2},enemy:rect(this.$el.querySelector(this.writer==='self'?'.enemy-field':'.friendly-field')),friendly:rect(this.$el.querySelector(this.writer==='self'?'.friendly-field':'.enemy-field'))};const badge=this.$el.querySelector('.preview-kami.'+this.writer+' .kami-susanoo-mark');this.swordLanding=badge?rect(badge):null;this.flameTargets=[];
if(this.no===7){const field=this.layout.enemy,w=Math.min(100,field.width*.18),h=Math.min(135,field.height*.85);this.flameTargets=[{left:field.left+field.width*[.2,.5,.8][this.flameSlot]-w/2,top:field.top+(field.height-h)/2,width:w,height:h,kind:'card',image:'card_images/600/001.webp'},Object.assign(rect(this.$el.querySelector('.preview-kami.'+(this.writer==='self'?'opp':'self'))),{kind:'kami'})];}
this.phase='closeup';if(this.no===7)this._captureT=setTimeout(()=>{this.flameCaptured=true},this.duration*.3);if(this.no===10)this._soundTimer=setTimeout(()=>this.testRoar(),this.duration*.82);this._timer=setTimeout(()=>{if(this.no===10)this.sealArrival();else this.phase=null},this.duration+(this.no===10?3200:0))}
}});
</script></html>
