<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>創世決戦・四象限構図</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
    body { margin: 0; color: #f3f0ec; background: #11131c; }
    header, main { max-width: 1280px; margin: auto; padding: 24px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    header p, figcaption { color: #cbc8d2; line-height: 1.6; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding-top: 0; }
    figure { margin: 0; padding: 12px; border: 1px solid #716146; border-radius: 13px; background: #202330; }
    figure > a img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 7px; }
    figcaption { padding: 12px 2px 2px; }
    strong { color: #ebd49d; }
    .small { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .86rem; }
    .small img { width: 105px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    @media (max-width: 900px) { main { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>創世決戦・四象限の画像候補</h1>

  </header>
  <main>
    <figure><a href="variant-01-750de4adf84d.webp"><img src="variant-01-750de4adf84d.webp" alt="候補1・中央の神域に4人の攻撃が集まる"></a><figcaption><strong>候補1：中央の神域</strong><br>背景まで一つの戦場としてつながる構図。<div class="small"><img src="variant-01-750de4adf84d.webp" alt="候補1の縮小版">メニュー相当の縮小表示</div></figcaption></figure>
    <figure><a href="variant-02-25699cad0e2f.webp"><img src="variant-02-25699cad0e2f.webp" alt="候補2・4人の力が一点で激突する"></a><figcaption><strong>候補2：力の激突</strong><br>4人の力が中央で激しくぶつかる構図。<div class="small"><img src="variant-02-25699cad0e2f.webp" alt="候補2の縮小版">メニュー相当の縮小表示</div></figcaption></figure>
    <figure><a href="variant-03-b79cc19838ed.webp"><img src="variant-03-b79cc19838ed.webp" alt="候補3・4人それぞれの戦闘姿勢がよく見える"></a><figcaption><strong>候補3：四者の構え</strong><br>4人の戦う姿勢と表情を大きく見せる構図。<div class="small"><img src="variant-03-b79cc19838ed.webp" alt="候補3の縮小版">メニュー相当の縮小表示</div></figcaption></figure>
  </main>

</html>
