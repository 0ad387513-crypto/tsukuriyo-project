<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ツクリヨ 場のカードの切り取り調整</title>
<style>
  /* 左にカードの一覧、右に選んだカードの調整。対戦の場と同じ形の札で、切り取る位置と拡大率を決めて field_card_art.js に保存する */
  :root { color-scheme: dark; --bg: #11141d; --surface: #1a1f2c; --sunken: #232a3a; --line: #343c50; --fg: #e6e9f2; --muted: #9aa3b8; --accent: #8ea6f2; --ok: #7fd0a2; --warn: #e9c06a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 Meiryo, "Yu Gothic", sans-serif; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  h1 { font: 800 20px/1.3 "Yu Mincho", serif; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .gridview { padding: 16px 18px 90px; display: flex; flex-direction: column; gap: 14px; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: inherit; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .cell:hover, .cell:focus-visible { border-color: var(--accent); }
  .cell .nm { font-weight: 700; font-size: 14px; }
  .cell .pair { display: flex; gap: 10px; align-items: flex-end; }
  .cell img { width: 64px; border-radius: 4px; }
  .cell .tag { font-size: 11px; color: var(--warn); }
  .layout[hidden], .gridview[hidden] { display: none; }
  .layout { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 18px; padding: 16px 18px 90px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  input[type="search"], select { font: inherit; color: var(--fg); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input[type="search"] { flex: 1 1 140px; min-width: 0; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; max-height: calc(100vh - 190px); overflow: auto; padding-right: 4px; }
  .item { border: 2px solid transparent; border-radius: 8px; background: none; color: inherit; font: inherit; padding: 3px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .item[aria-current="true"] { border-color: var(--accent); background: var(--sunken); }
  .item .nm { font-size: 11px; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
  .item .tag { font-size: 10px; color: var(--warn); }
  /* 場の札（対戦画面と同じ考え方：枠の色の札の内側に絵の層） */
  .token { position: relative; background: #a8a8a8; border-radius: 9px; box-shadow: 0 0 0 1.5px rgba(14, 11, 8, .9); flex: none; }
  .token.legacy { height: var(--h); width: calc(var(--h) * .78); }
  .token.relic { height: var(--h); width: var(--h); background: transparent; box-shadow: none; }
  .token .art { position: absolute; inset: 2.5px; border-radius: 7px; background-color: #1a1d2a; background-repeat: no-repeat; overflow: hidden; }
  .token.relic .art { inset: 0; border-radius: 0; clip-path: polygon(24% 4%, 76% 4%, 96% 19%, 96% 81%, 76% 96%, 24% 96%, 4% 81%, 4% 19%); }
  .token .wide { position: absolute; left: 4%; width: 92%; top: 50%; transform: translateY(-50%); aspect-ratio: 462 / 416; background-repeat: no-repeat; background-size: 129.87% 201.207%; background-position: 78.261% 11.08%; }
  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .stage { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; }
  .stage figure { margin: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .stage figcaption { font-size: 12px; color: var(--muted); }
  .big { cursor: grab; touch-action: none; }
  .big.dragging { cursor: grabbing; }
  .source { position: relative; width: min(300px, 100%); }
  .source img { display: block; width: 100%; border-radius: 6px; }
  .source .box { position: absolute; border: 2px solid var(--warn); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45); pointer-events: none; border-radius: 3px; }
  .controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; max-width: 620px; }
  .controls input[type="range"] { width: 100%; }
  .controls output { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.btn { font: 700 13px/1.2 Meiryo, sans-serif; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunken); color: var(--fg); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: #0f1320; border-color: var(--accent); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .state { font-size: 13px; }
  .state.dirty { color: var(--warn); font-weight: 700; }
  .state.saved { color: var(--ok); }
  input[type="text"] { font: inherit; color: var(--fg); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>場のカードの切り取り調整</h1>
  <span class="muted">対戦の場に出したときに見える部分を、カードごとに確認します。位置と拡大率はスライダーやドラッグで試せます。保存はキジマ専用です（キジマのPCで保存すると、確認用のゲームを読み込み直したときに反映されます）。</span>
</header>
<section class="gridview" id="gridView">
  <div class="filters">
    <input type="search" id="gq" placeholder="名前・番号" aria-label="カードを探す">
    <select id="gkind" aria-label="種類"><option value="field">場に出るカード</option><option value="legacy">レガシー</option><option value="relic">レリック</option><option value="custom">調整済みだけ</option></select>
    <span class="muted" id="gcount"></span>
  </div>
  <div class="cells" id="cells"></div>
</section>
<div class="layout" id="editView" hidden>
  <aside class="side">
    <button class="btn" type="button" id="toGrid">◀ 一覧へ戻る</button>
    <div class="filters">
      <input type="search" id="q" placeholder="名前・番号" aria-label="カードを探す">
      <select id="kind" aria-label="種類"><option value="field">場に出るカード</option><option value="legacy">レガシー</option><option value="relic">レリック</option><option value="custom">調整済みだけ</option></select>
    </div>
    <span class="muted" id="count"></span>
    <div class="list" id="list"></div>
  </aside>
  <section class="main" id="main"><p class="muted">左の一覧からカードを選んでください。</p></section>
</div>
<script src="/field_card_art.js"></script>
<script>
(() => {
  "use strict";
  // キジマのPC（確認用サーバー）で開いたときだけ保存できる。メンバーは位置や拡大率を試せるが保存はできない
  const OWNER = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pad3 = n => String(parseInt(n, 10)).padStart(3, "0");
  const IMG_W = 600, IMG_H = 837;
  // 対戦画面の既定値（index.html の .token-art と同じ）
  const DEF = { legacy: { x: 68, y: 8, z: 200 }, relic: { x: 77, y: 11, z: 205 } };
  let cards = [], crops = {}, sel = null, cur = null, saved = null;

  const isRelic = c => c.category === "レリック";
  const onField = c => c.category === "レガシー" || c.category === "レリック" || c.token;
  const shape = c => isRelic(c) ? "relic" : "legacy";
  const parseCrop = (c, crop) => {
    const d = DEF[shape(c)], r = { x: d.x, y: d.y, z: d.z, wide: false, note: (crop && crop.note) || "" };
    if (!crop) return r;
    if (crop.wide) r.wide = true;
    const p = String(crop.position || "").match(/(-?[\d.]+)%\s+(-?[\d.]+)%/); if (p) { r.x = +p[1]; r.y = +p[2]; }
    const z = String(crop.size || "").match(/auto\s+([\d.]+)%/); if (z) r.z = +z[1];
    return r;
  };
  const isDefault = (c, v) => { const d = DEF[shape(c)]; return !v.wide && v.x === d.x && v.y === d.y && v.z === d.z; };
  const url = c => "/card_images/600/" + pad3(c.no) + ".webp";

  /* 札の中の絵だけを今の設定に合わせる（札そのものは作り直さない） */
  function paintToken(t, c, v) {
    const art = t.querySelector(".art"), u = `url("${url(c)}")`;
    let w = art.querySelector(".wide");
    if (v.wide) {
      art.style.backgroundImage = "none";
      if (!w) { w = el("div", "wide"); w.style.backgroundImage = u; art.append(w); }
    } else {
      if (w) w.remove();
      art.style.backgroundImage = u; art.style.backgroundSize = `auto ${v.z}%`; art.style.backgroundPosition = `${v.x}% ${v.y}%`;
    }
  }
  function token(c, v, h) {
    const t = el("div", "token " + shape(c)); t.style.setProperty("--h", h + "px");
    const art = el("div", "art");
    if (v.wide) { const w = el("div", "wide"); w.style.backgroundImage = `url("${url(c)}")`; art.append(w); }
    else { art.style.backgroundImage = `url("${url(c)}")`; art.style.backgroundSize = `auto ${v.z}%`; art.style.backgroundPosition = `${v.x}% ${v.y}%`; }
    t.append(art); return t;
  }
  /* 元のカード画像の中で、札に見えている範囲（拡大率と位置から計算） */
  function visibleBox(c, v, h) {
    const w = shape(c) === "relic" ? h : h * .78, ch = shape(c) === "relic" ? h : h - 5, cw = shape(c) === "relic" ? w : w - 5;
    const ih = ch * v.z / 100, iw = ih * IMG_W / IMG_H;
    const ox = (cw - iw) * v.x / 100, oy = (ch - ih) * v.y / 100;
    return { left: -ox / iw, top: -oy / ih, width: cw / iw, height: ch / ih };
  }

  const numsOf = c => c.same ? c.same : [String(parseInt(c.no, 10))];
  const labelOf = c => "No." + numsOf(c).join(",") + " " + c.name;
  const firstOfGroup = c => !c.same || c.same[0] === String(parseInt(c.no, 10));
  function renderGrid() {
    const q = $("gq").value.trim().toLowerCase(), kind = $("gkind").value;
    const list = cards.filter(c => firstOfGroup(c) && onField(c) && (kind === "field" || (kind === "legacy" && !isRelic(c)) || (kind === "relic" && isRelic(c)) || (kind === "custom" && crops[String(parseInt(c.no, 10))]))
      && (!q || (c.name + " " + (c.nickname || "") + " " + c.no).toLowerCase().includes(q)));
    $("gcount").textContent = list.length + "枚";
    $("cells").replaceChildren(...list.map(c => {
      const b = el("button", "cell"); b.type = "button"; b.dataset.no = String(parseInt(c.no, 10));
      const pair = el("div", "pair"); const img = el("img"); img.src = "/card_images/320/" + pad3(c.no) + ".webp"; img.alt = ""; img.loading = "lazy";
      pair.append(token(c, parseCrop(c, crops[String(parseInt(c.no, 10))]), 150), img);
      b.append(el("span", "nm", labelOf(c)), pair);
      if (crops[String(parseInt(c.no, 10))]) b.append(el("span", "tag", "調整済み"));
      b.addEventListener("click", () => openEditor(c));
      return b;
    }));
  }
  function openEditor(c) { $("gridView").hidden = true; $("editView").hidden = false; select(c); scrollTo(0, 0); }
  function showGrid() {
    if (cur && saved && JSON.stringify(cur) !== JSON.stringify(saved) && !confirmLeave()) return;
    $("editView").hidden = true; $("gridView").hidden = false; renderGrid();
  }
  $("gq").addEventListener("input", renderGrid); $("gkind").addEventListener("change", renderGrid);
  // 開発ダッシュボードから「このカード」を指定して開いたとき（?no=番号）
  window.openFieldCard = no => { const c = cards.find(x => firstOfGroup(x) && numsOf(x).includes(String(no))); if (c) openEditor(c); };
  function renderList() {
    const q = $("q").value.trim().toLowerCase(), kind = $("kind").value;
    const list = cards.filter(c => firstOfGroup(c) && onField(c) && (kind === "field" || (kind === "legacy" && !isRelic(c)) || (kind === "relic" && isRelic(c)) || (kind === "custom" && crops[String(parseInt(c.no, 10))]))
      && (!q || (c.name + " " + (c.nickname || "") + " " + c.no).toLowerCase().includes(q)));
    $("count").textContent = list.length + "枚";
    $("list").replaceChildren(...list.map(c => {
      const b = el("button", "item"); b.type = "button"; b.setAttribute("aria-current", String(sel === c));
      b.append(token(c, parseCrop(c, crops[String(parseInt(c.no, 10))]), 86), el("span", "nm", labelOf(c)));
      if (crops[String(parseInt(c.no, 10))]) b.append(el("span", "tag", "調整済み"));
      b.addEventListener("click", () => { if (cur && saved && JSON.stringify(cur) !== JSON.stringify(saved) && !confirmLeave()) return; select(c); });
      return b;
    }));
  }
  let leaveArmed = false;
  function confirmLeave() { if (leaveArmed) { leaveArmed = false; return true; } leaveArmed = true; $("st").textContent = "保存していない変更があります。もう一度押すと、変更を捨てて移動します。"; $("st").className = "state dirty"; return false; }

  function select(c) {
    sel = c; leaveArmed = false;
    saved = parseCrop(c, crops[String(parseInt(c.no, 10))]); cur = Object.assign({}, saved);
    renderList(); renderMain();
  }
  function renderMain() {
    const c = sel, main = $("main");
    const title = el("div", "row"); title.append(el("h2", "", "No." + numsOf(c).join(",") + " " + (c.nickname ? c.nickname + "・" : "") + c.name), el("span", "muted", (c.category || "") + (c.token ? "（トークン）" : "")));
    const stagePanel = el("div", "panel"), stage = el("div", "stage");
    const bigFig = el("figure"), big = token(c, cur, 360); big.classList.add("big"); bigFig.append(big, el("figcaption", "", "ドラッグで位置、ホイールで拡大率を変えられます（拡大表示）"));
    const realFig = el("figure"), real = token(c, cur, Math.round(innerHeight * .175)); real.classList.add("real"); realFig.append(real, el("figcaption", "", "対戦画面の大きさ"));
    const srcFig = el("figure"), src = el("div", "source"), img = el("img"); img.src = url(c); img.alt = c.name + "のカード画像"; const box = el("div", "box"); src.append(img, box); srcFig.append(src, el("figcaption", "", "カード全体（枠の中が見える部分）"));
    stage.append(bigFig, realFig, srcFig); stagePanel.append(stage);

    const ctl = el("div", "panel"), grid = el("div", "controls");
    const slider = (label, key, min, max, step) => {
      const r = el("input"); r.type = "range"; r.min = min; r.max = max; r.step = step; r.value = cur[key]; r.id = "s-" + key; r.setAttribute("aria-label", label);
      const o = el("output", "", cur[key] + "%");
      r.addEventListener("input", () => { leaveWide(); cur[key] = +r.value; o.textContent = r.value + "%"; refresh(); });
      grid.append(el("label", "", label), r, o); return r;
    };
    const zr = slider("拡大率", "z", 100, 400, 1), xr = slider("横の位置", "x", 0, 100, .5), yr = slider("縦の位置", "y", 0, 100, .5);
    ctl.append(grid);
    let wideBox = null, wideNote = null;
    // 絵柄全体の表示から、切り取りの表示に切り替える（レリックで「絵柄全体」にしているカード用）
    const leaveWide = () => { if (!cur.wide) return; cur.wide = false; if (wideBox) wideBox.checked = false; };
    if (shape(c) === "relic") {
      const lab = el("label", "row"); wideBox = el("input"); wideBox.type = "checkbox"; wideBox.checked = cur.wide;
      wideBox.addEventListener("change", () => { cur.wide = wideBox.checked; refresh(); });
      lab.append(wideBox, document.createTextNode("絵柄全体を表示する（上の位置・拡大率は使いません）")); ctl.append(lab);
      wideNote = el("p", "muted", "今は絵柄全体を表示しています。切り取る位置を決めたいときは、スライダーや拡大表示の札を動かすと、自動で切り取りの表示に切り替わります。"); ctl.append(wideNote);
    }
    const note = el("input"); note.type = "text"; note.maxLength = 60; note.placeholder = "メモ（例：右の人物の顔を中央に）"; note.value = cur.note || ""; note.setAttribute("aria-label", "メモ");
    note.addEventListener("input", () => { cur.note = note.value; refresh(); });
    ctl.append(note);
    const row = el("div", "row");
    const save = el("button", "btn primary", OWNER ? "保存する" : "保存する（キジマ専用）"); save.type = "button";
    if (!OWNER) { save.title = "キジマ専用"; }
    const undo = el("button", "btn", "保存した状態に戻す"); undo.type = "button";
    const def = el("button", "btn", "対戦画面の既定に戻す"); def.type = "button";
    const st = el("span", "state"); st.id = "st";
    row.append(save, undo, def, st); ctl.append(row);
    main.replaceChildren(title, stagePanel, ctl);

    function refresh() {
      paintToken(big, c, cur); paintToken(real, c, cur);
      const v = visibleBox(c, cur, 360);
      box.hidden = cur.wide;
      Object.assign(box.style, { left: v.left * 100 + "%", top: v.top * 100 + "%", width: v.width * 100 + "%", height: v.height * 100 + "%" });
      zr.value = cur.z; xr.value = cur.x; yr.value = cur.y;
      for (const [r, k] of [[zr, "z"], [xr, "x"], [yr, "y"]]) { r.nextSibling.textContent = cur[k] + "%"; r.disabled = false; }
      if (wideNote) wideNote.hidden = !cur.wide;
      const dirty = JSON.stringify(cur) !== JSON.stringify(saved);
      st.className = "state" + (dirty ? " dirty" : ""); st.textContent = dirty ? "保存していない変更があります" : (isDefault(c, cur) ? "対戦画面の既定のまま" : "保存済み");
      save.disabled = !dirty || !OWNER;
    }
    /* 拡大表示の札をドラッグすると、絵がその方向に動くように位置を変える */
    function bindDrag(t) {
      t.addEventListener("pointerdown", e => {
        leaveWide();
        t.setPointerCapture(e.pointerId); t.classList.add("dragging");
        const start = { x: e.clientX, y: e.clientY, cx: cur.x, cy: cur.y };
        const rect = t.getBoundingClientRect(), ch = rect.height, cw = rect.width, ih = ch * cur.z / 100, iw = ih * IMG_W / IMG_H;
        const move = ev => {
          const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
          const clamp = v => Math.max(0, Math.min(100, Math.round(v * 2) / 2));
          if (iw !== cw) cur.x = clamp(start.cx + dx / (cw - iw) * 100);
          if (ih !== ch) cur.y = clamp(start.cy + dy / (ch - ih) * 100);
          refresh();
        };
        const up = () => { t.classList.remove("dragging"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); t.removeEventListener("pointercancel", up); };
        t.addEventListener("pointermove", move); t.addEventListener("pointerup", up); t.addEventListener("pointercancel", up);
      });
    }
    bindDrag(big);
    // マウスホイールで拡大率を変える（上で拡大・下で縮小。1目盛り5%）。ページのスクロールにはしない
    big.addEventListener("wheel", ev => {
      leaveWide();
      ev.preventDefault();
      const step = ev.deltaY < 0 ? 5 : -5;
      cur.z = Math.max(100, Math.min(400, Math.round((cur.z + step) / 5) * 5));
      refresh();
    }, { passive: false });
    undo.addEventListener("click", () => { cur = Object.assign({}, saved); note.value = cur.note || ""; if (wideBox) wideBox.checked = cur.wide; refresh(); });
    def.addEventListener("click", () => { const d = DEF[shape(c)]; Object.assign(cur, { x: d.x, y: d.y, z: d.z, wide: false }); if (wideBox) wideBox.checked = false; refresh(); });
    save.addEventListener("click", async () => {
      save.disabled = true; st.textContent = "保存しています…";
      try {
        const body = { no: String(parseInt(c.no, 10)), name: c.name, note: cur.note || "" };
        if (!isDefault(c, cur)) { if (cur.wide) body.wide = true; else { body.position = `${cur.x}% ${cur.y}%`; if (cur.z !== DEF[shape(c)].z) body.size = `auto ${cur.z}%`; } }
        // 同じカードの別版にも、同じ切り取りを入れる
        let j = null;
        for (const no of numsOf(c)) {
          const res = await fetch("/__dev/field-art", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({}, body, { no })) });
          j = await res.json().catch(() => ({}));
          if (!res.ok || !j.ok) throw new Error((j && j.message) || "保存できませんでした");
        }
        crops = j.crops; saved = parseCrop(c, crops[body.no]); cur = Object.assign({}, saved, { note: cur.note });
        saved.note = cur.note; refresh(); renderList(); st.className = "state saved"; st.textContent = "保存しました。確認用のゲームを読み込み直すと反映されます。";
      } catch (e) { st.className = "state dirty"; st.textContent = e.message; save.disabled = false; }
    });
    refresh();
  }

  $("q").addEventListener("input", renderList); $("kind").addEventListener("change", renderList);
  $("toGrid").addEventListener("click", showGrid);
  (async () => {
    try {
      let j = null;
      if (OWNER) { try { j = await (await fetch("/__dev/field-art")).json(); } catch (e) { j = null; } }
      if (!j || !j.ok) {
        // メンバー（本番）：今の設定は field_card_art.js から、カードの一覧は同じフォルダの cards.json から読む
        const list = await (await fetch("/tools/field-card-crop/cards.json")).json();
        j = { ok: true, cards: list.cards || [], crops: JSON.parse(JSON.stringify(typeof FIELD_CARD_ART_CROPS !== "undefined" ? FIELD_CARD_ART_CROPS : {})) };
      }
      cards = j.cards; crops = j.crops; renderList(); renderGrid();
      if (!cards.length) $("main").replaceChildren(el("p", "muted", "カードの一覧がありません。node tools/board/build.js を一度実行してください。"));
    } catch (e) { $("main").replaceChildren(el("p", "muted", "読み込めませんでした。確認用サーバー（npm run preview）で開いてください。" + (e.message || ""))); }
  })();
})();
</script>
</body>
</html>
