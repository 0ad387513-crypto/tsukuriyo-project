<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ツクリヨ OPの場面</title>
<link rel="stylesheet" href="/tools/hub/hub.css">
<style>
  /* 創世決戦OPの8場面を、絵と語りの文で上から順に並べる。場面を押すと、その場面への修正メモを書ける */
  .scenes { display: flex; flex-direction: column; gap: 16px; }
  .scene { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; align-items: start; }
  .scene img { width: 100%; border-radius: 6px; display: block; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  .scene .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .scene .nm { font-family: "Yu Mincho", serif; font-weight: 700; font-size: 17px; }
  .scene .text { font-family: "Yu Mincho", serif; line-height: 1.9; }
  @media (max-width: 720px) { .scene { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>創世決戦OPの場面</h1>
  <p class="muted">オープニングで流れる場面の絵と語りの文を、流れる順に並べています。気になる場面を押すと、修正メモを書けます。内容はゲーム本体（このページの版）と同じものを読み込んでいます。</p>
  <div class="scenes" id="scenes"><p class="muted">読み込んでいます…</p></div>
</main>
<script>
(() => {
  "use strict";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // ゲーム本体の GENESIS_STORY_SCENES を読み取って表示する（場面の差し替えに自動で追従する）
  (async () => {
    try {
      const html = await (await fetch("/index.html", { cache: "no-store" })).text();
      const dur = (html.match(/GENESIS_STORY_SCENE_DURATIONS_MS = Object\.freeze\(\[([^\]]+)\]\)/) || [])[1];
      const durations = dur ? dur.split(",").map(x => Number(x.trim())) : [];
      const re = /id: '([^']+)', duration: GENESIS_STORY_SCENE_DURATIONS_MS\[(\d+)\],\s*image: '([^']+)',\s*alt: '([^']*)',\s*text: '([^']*)'/g;
      const scenes = []; let m;
      while ((m = re.exec(html))) scenes.push({ id: m[1], sec: (durations[+m[2]] || 0) / 1000, image: m[3], alt: m[4], text: m[5] });
      if (!scenes.length) throw new Error("場面が見つかりません");
      let t = 0;
      document.getElementById("scenes").replaceChildren(...scenes.map((s, i) => {
        const box = el("section", "scene"); box.dataset.scene = s.id;
        const img = el("img"); img.src = "/" + s.image; img.alt = s.alt; img.loading = "lazy";
        const body = el("div", "body");
        const from = t; t += s.sec;
        const mmss = v => Math.floor(v / 60) + ":" + String(Math.round(v % 60)).padStart(2, "0");
        body.append(el("div", "nm", "場面" + (i + 1)), el("div", "muted", mmss(from) + "〜" + mmss(t) + "（" + s.sec + "秒）"), el("div", "text", s.text), el("div", "muted", "絵の説明：" + s.alt));
        box.append(img, body);
        return box;
      }));
    } catch (e) { document.getElementById("scenes").replaceChildren(el("p", "err", "場面を読み込めませんでした（" + e.message + "）")); }
  })();
})();
</script>
</body>
</html>
