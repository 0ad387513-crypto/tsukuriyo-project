<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- カードボイスの確認ページ（ローカル専用。npm run preview 中に http://localhost:8765/tools/voice-preview/ で開く。本番では _redirects で404）。
     voices/cards/voices.json（候補・登録状況）と tools/voice-script/card_voice_cast.json（キャスト）を読み、
     候補（voices/cards/previews/）と作った台詞（voices/cards/）を再生する。登録などの操作はコマンドをコピーして PowerShell で実行する -->
<title>カードボイス 試聴室</title>
<style>
  :root {
    --bg: #12172a; --panel: #1a2133; --line: #323b54; --ink: #ece6d6; --muted: #9aa3b8;
    --gold: #e3bf6e; --gold-soft: #3a3324; --ok: #7fd3a0; --ok-soft: #1f3a2b; --focus: #8fb0f0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 60px; }
  h1 { font-family: "Shippori Mincho", "Yu Mincho", serif; font-size: 28px; margin: 0 0 6px; letter-spacing: .04em; }
  .lead { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
  .bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .bar input[type=search] { font: inherit; flex: 1 1 220px; min-width: 0; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .bar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .bar select, .bar button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .summary { font-size: 13px; color: var(--muted); }
  .cast { border-top: 1px solid var(--line); padding-block: 16px; display: grid; gap: 10px; }
  .cast-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
  .cast-name { font-family: "Shippori Mincho", "Yu Mincho", serif; font-size: 20px; font-weight: 700; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
  .chip.done { background: var(--ok-soft); color: var(--ok); }
  .labels { font-size: 12px; color: var(--muted); }
  details.desc summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  details.desc p { font-size: 12px; color: var(--muted); margin: 6px 0 0; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .cand { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
  .cand.chosen { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .cand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cand-top b { font-size: 14px; }
  audio { width: 100%; height: 36px; }
  .copy { font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold-soft); color: var(--gold); cursor: pointer; white-space: nowrap; }
  .copy:focus-visible, .bar button:focus-visible, .bar select:focus-visible, .bar input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .lines-list { display: grid; gap: 6px; }
  .line-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 10px; align-items: center; font-size: 14px; }
  .line-row small { color: var(--muted); display: block; font-size: 11px; }
  .missing { color: var(--muted); font-size: 12px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .copy.main { background: var(--gold); color: var(--bg); }
  .copy.small { font-size: 11px; padding: 3px 8px; font-weight: 400; }
  .line-row { grid-template-columns: 52px minmax(0, 1fr) minmax(220px, 300px) auto; }
  @media (max-width: 640px) { .line-row { grid-template-columns: 52px minmax(0, 1fr); } .line-row > :nth-child(n+3) { grid-column: 1 / -1; } }
  .thumb { width: 52px; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); cursor: zoom-in; padding: 0; display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; display: block; }
  .thumb:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .cards .thumb { width: 84px; }
  .viewer { border: 0; padding: 0; background: transparent; max-width: min(92vw, 520px); max-height: 92vh; }
  .viewer::backdrop { background: rgba(0, 0, 0, .75); }
  .viewer img { display: block; width: 100%; height: auto; max-height: 86vh; object-fit: contain; border-radius: 10px; cursor: zoom-out; }
  .viewer p { margin: 6px 0 0; text-align: center; color: #fff; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); padding: 30px 0; }
  .line-acts { display: flex; gap: 6px; }
  .dir-tag { font-size: 11px; color: var(--gold); margin-left: 6px; }
  .dir { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .dir[hidden] { display: none; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .preset[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
  .dir-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .dir-row input, .dir-row select { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .dir-row input { flex: 1 1 220px; min-width: 0; }
  .dir-note { font-size: 11px; color: var(--muted); margin: 0; }
  .dir { gap: 12px; }
  .step { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .step:last-child { border-bottom: 0; padding-bottom: 0; }
  .step h4 { margin: 0; font-size: 13px; color: var(--gold); }
  .step textarea { font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; width: 100%; }
  .step textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .step > .copy.small { justify-self: start; }
  .orig { color: var(--muted); }
  .orig[hidden] { display: none; }
  details.adv summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  details.adv .dir-row { margin-top: 6px; }
  .cmd { display: block; font-family: Consolas, "Courier New", monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; overflow-wrap: anywhere; user-select: all; }
  .preset:focus-visible, .dir-row input:focus-visible, .dir-row select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>カードボイス 試聴室</h1>
  <p class="lead">声の候補と、作った台詞を聴いて確認するページです。「この候補に決める」を押すと登録用のコマンドがコピーされるので、PowerShell に貼り付けて実行してください。新しい候補を作ったあとは「最新の状態に更新」を押します。台詞の「直す・作り直す」から、読み上げる文の言い換えと演技の方針（「戦闘中の掛け声として」など自由に書けます）を台詞ごとに指定して、作り直すコマンドをコピーできます。指定はこのPCの確認用サーバーにだけ保存されます。</p>
  <div class="bar">
    <input type="search" id="q" placeholder="キャスト名で探す（例：ライカ）" aria-label="キャスト名で探す">
    <label for="show">表示
      <select id="show">
        <option value="active">候補・声があるキャスト</option>
        <option value="all">すべてのキャスト</option>
        <option value="todo">未着手のキャスト</option>
      </select>
    </label>
    <button type="button" id="reload">最新の状態に更新</button>
    <span class="summary" id="summary"></span>
  </div>
  <main id="list"><div class="empty">読み込んでいます…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="viewer" id="viewer" aria-label="カードの拡大表示"><img id="viewerImg" alt=""><p id="viewerCap"></p></dialog>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOOL = "node scripts/generate_card_voices_elevenlabs.js";
  let data = { cast: {}, record: {}, lines: {}, pairs: {}, items: null, directions: {} };
  // 演技の指定。ElevenLabs の演技タグ（英語の [ ] 書き）を台詞の頭に付けて読ませる。1〜2個までが自然
  const PRESETS = ["戦闘中の掛け声として", "敵に斬りかかる瞬間", "攻撃を受けて", "倒れる間際に", "はきはきと", "明るく元気に", "落ち着いて", "力強く", "ささやくように", "悲しげに", "怒りをこめて", "笑いながら", "叫びすぎない"];
  const STABILITY = [["", "標準（共通の設定 0.5）"], ["0", "0：表情を大きく（ぶれやすい）"], ["0.5", "0.5：自然"], ["1", "1：安定（平板になりやすい）"]];
  async function saveDirection(ref, body) {
    const r = await fetch("/__dev/voice-direction?ref=" + encodeURIComponent(ref), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.message || "保存できませんでした");
    if (j.direction) data.directions[ref] = j.direction; else delete data.directions[ref];
  }
  // 台詞の行の表示を、保存した指定に合わせて更新する
  function showLine(it, spoken, orig, label) {
    const d = data.directions[it.ref] || {};
    spoken.textContent = d.text || it.text;
    orig.textContent = d.text ? "台本の文：" + it.text : "";
    orig.hidden = !d.text;
    label.textContent = describe(it.ref);
  }
  function describe(ref) {
    const d = data.directions[ref];
    if (!d) return "";
    return [d.text ? "読み替えあり" : "", d.direction ? "方針「" + (d.direction.length > 24 ? d.direction.slice(0, 24) + "…" : d.direction) + "」" : "", d.tags ? "タグ " + d.tags : "", d.stability !== undefined ? "安定度" + d.stability : ""].filter(Boolean).join("・");
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  function fixPanel(it, refresh) {
    const cur = data.directions[it.ref] || {};
    const cmd = TOOL + " lines --ref " + it.ref + " --force";
    const box = el("div", "dir"); box.hidden = true;

    // ① 読み上げる文
    const s1 = el("section", "step");
    const text = el("textarea"); text.rows = 2; text.value = cur.text || it.text; text.setAttribute("aria-label", "読み上げる文");
    const reset = el("button", "copy small", "台本の文に戻す"); reset.type = "button";
    reset.addEventListener("click", () => { text.value = it.text; });
    s1.append(el("h4", "", "① 読み上げる文を変える（必要なときだけ）"), text,
      el("p", "dir-note", "台本の文はそのままで、音声だけこの文で作ります。読み間違いを直すときは、ひらがなにしたり「、」で間を入れたりします。台本そのものを変えるときは共有ページで編集してください。"), reset);

    // ② 演技の方針（日本語で自由に）
    const s2 = el("section", "step");
    const direction = el("textarea"); direction.rows = 2; direction.value = cur.direction || ""; direction.setAttribute("aria-label", "演技の方針");
    direction.placeholder = "例：戦闘中、敵に斬りかかる瞬間の短い気合いの掛け声。叫びすぎない";
    const presets = el("div", "presets");
    for (const phrase of PRESETS) {
      const b = el("button", "preset", "＋" + phrase); b.type = "button";
      b.addEventListener("click", () => { const v = direction.value.trim(); direction.value = v ? v.replace(/[。、]$/, "") + "、" + phrase : phrase; direction.focus(); });
      presets.append(b);
    }
    const sel = el("select"); sel.setAttribute("aria-label", "安定度");
    for (const [v, t] of STABILITY) sel.append(new Option(t, v));
    sel.value = cur.stability === undefined ? "" : String(cur.stability);
    const r2 = el("div", "dir-row"); r2.append("安定度", sel);
    // 以前の英語タグ（残っている指定だけ見せる）
    const tags = el("input"); tags.type = "text"; tags.value = cur.tags || ""; tags.setAttribute("aria-label", "英語の演技タグ"); tags.placeholder = "例：[excited]";
    const adv = el("details", "adv"); const advSum = el("summary", "", "英語の演技タグ（細かく効かせたいときだけ）");
    const r1 = el("div", "dir-row"); r1.append(tags); adv.append(advSum, r1); adv.open = !!cur.tags;
    s2.append(el("h4", "", "② 演技の方針を書く（必要なときだけ）"), direction, presets,
      el("p", "dir-note", "どんな場面で、どんな気持ちで言うのかを日本語で自由に書いてください。読み上げられることはなく、台詞の直前の状況として声の演技に使われます。ボタンを押すと言葉が書き足されます。"), r2, adv);

    // ③ 保存してコマンドをコピー
    const s3 = el("section", "step");
    const save = el("button", "copy main", "保存してコマンドをコピー"); save.type = "button";
    const clear = el("button", "copy small", "①②の指定をすべて消す"); clear.type = "button";
    const code = el("code", "cmd", cmd);
    const btns = el("div", "btns"); btns.append(save, clear);
    save.addEventListener("click", async () => {
      try {
        const t = text.value.trim();
        await saveDirection(it.ref, { text: t && t !== it.text ? t : "", direction: direction.value.trim(), tags: tags.value.trim(), stability: sel.value === "" ? null : Number(sel.value) });
        refresh();
        await copy(cmd);
      } catch (e) { toast(e.message); }
    });
    clear.addEventListener("click", async () => {
      try { await saveDirection(it.ref, { text: "", direction: "", tags: "", stability: null }); text.value = it.text; direction.value = ""; tags.value = ""; sel.value = ""; refresh(); toast("指定を消しました（台本の文・標準の演技で作ります）"); } catch (e) { toast(e.message); }
    });
    s3.append(el("h4", "", "③ 保存して、作り直すコマンドをコピー"), btns, code,
      el("p", "dir-note", "コピーしたコマンドを PowerShell に貼り付けて実行すると、この台詞だけ作り直します。終わったら上の「最新の状態に更新」を押して聴き直してください。①②を変えずに押すと、同じ指定のまま作り直します（毎回少しずつ違う読み方になります）。"));

    box.append(s1, s2, s3);
    return box;
  }
  // 台詞を話すカードの画像。n051 → card_images/320/051.webp（押すと 600 の大きい画像）
  const cardNo = id => String(id || "").replace(/^n/, "").replace(/-.*$/, "");
  function cardThumb(id, title) {
    const no = cardNo(id);
    const b = el("button", "thumb"); b.type = "button"; b.title = title || ""; b.setAttribute("aria-label", (title || "カード") + "を大きく表示");
    if (!/^\d{3}$/.test(no)) { b.hidden = true; return b; }
    const img = el("img"); img.loading = "lazy"; img.alt = ""; img.src = "/card_images/320/" + no + ".webp";
    img.addEventListener("error", () => { b.hidden = true; });
    b.append(img);
    b.addEventListener("click", () => {
      $("viewerImg").src = "/card_images/600/" + no + ".webp"; $("viewerImg").alt = title || "";
      $("viewerCap").textContent = title || ""; $("viewer").showModal();
    });
    return b;
  }
  const enc = p => p.split("/").map(encodeURIComponent).join("/");
  const bust = () => "?t=" + Date.now(); // 作り直した音声を古いまま流さない

  function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("コピーしました：" + text); }
    catch (e) { prompt("このコマンドをコピーしてください", text); }
  }
  async function getJson(url, fallback) {
    try { const r = await fetch(url + bust(), { cache: "no-store" }); return r.ok ? await r.json() : fallback; } catch (e) { return fallback; }
  }
  async function exists(url) {
    try { const r = await fetch(url, { method: "HEAD", cache: "no-store" }); return r.ok; } catch (e) { return false; }
  }

  // 台本から、キャストごとの台詞（台詞ID・本文）を組み立てる（ツールと同じ規則の簡易版：作った音声ファイルの有無で確認）
  function linesFor(key) {
    // cast を実行すると作られる一覧があれば、それで正確に並べる（複数人の台詞も1人分ずつ出る）
    if (data.items) {
      const field = ref => ({ summon: "召喚時", attack: "攻撃時", death: "死亡時", use: "使用時", line: "掛け合い", reply: "返し" })[ref.split("-")[1]] || "";
      return data.items.filter(i => i.cast === key).map(i => ({ ref: i.ref, card: i.card, field: field(i.ref) + (i.ref !== i.group ? "（" + (i.together ? "同時" : "複数人") + "）" : ""), text: i.text, cardId: i.cardId }));
    }
    const out = [];
    const c = data.cast[key] || {};
    for (const [id, l] of Object.entries(data.lines)) {
      for (const f of ["summon", "attack", "death", "use"]) if (l[f]) out.push({ ref: `${id}-${f}`, card: l.card, field: { summon: "召喚時", attack: "攻撃時", death: "死亡時", use: "使用時" }[f], text: l[f], speaker: l.speaker });
    }
    for (const [id, p] of Object.entries(data.pairs)) {
      if (p.line) out.push({ ref: `${id}-line`, card: p.whoCard, field: "掛け合い", text: p.line, speaker: p.whoSpeaker });
      if (p.reply) out.push({ ref: `${id}-reply`, card: p.whoCard, field: "返し", text: p.reply, speaker: p.replyBy });
    }
    const base = key.replace(/[:（].*$/, "");
    const card = key.includes(":") ? key.split(":")[1] : null;
    return out.filter(o => card ? o.ref.startsWith(card) : (o.speaker || "").includes(base));
  }

  async function render() {
    const q = $("q").value.trim();
    const show = $("show").value;
    const keys = Object.keys(data.cast).filter(k => !data.cast[k].kami);
    let shown = 0, withVoice = 0, withCand = 0;
    const frag = document.createDocumentFragment();
    for (const key of keys) {
      const c = data.cast[key], r = data.record[key] || {};
      const cands = r.candidates || [];
      if (r.voiceId) withVoice++; if (cands.length) withCand++;
      const active = cands.length || r.voiceId;
      if (show === "active" && !active) continue;
      if (show === "todo" && active) continue;
      if (q && !key.includes(q) && !(c.labels || []).join(" ").includes(q)) continue;
      shown++;
      const sec = document.createElement("section"); sec.className = "cast";
      const head = document.createElement("div"); head.className = "cast-head";
      const name = document.createElement("span"); name.className = "cast-name"; name.textContent = key;
      const state = document.createElement("span"); state.className = "chip" + (r.voiceId ? " done" : "");
      state.textContent = r.released ? "声削除済み" : r.voiceId ? (r.source === "library" ? "ライブラリの声で登録済み" : `候補${r.choice}で登録済み`) : cands.length ? `候補${cands.length}個` : "未着手";
      const labels = document.createElement("span"); labels.className = "labels"; labels.textContent = (c.labels || []).join("／") + `｜台詞${c.lines || 0}本`;
      head.append(name, state, labels);
      if (r.voiceId && !r.released) {
        const mk = document.createElement("button"); mk.type = "button"; mk.className = "copy main"; mk.textContent = "台詞を作る（未作成の分）";
        mk.addEventListener("click", () => copy(`${TOOL} lines --cast ${key}`));
        head.append(mk);
      }
      const desc = document.createElement("details"); desc.className = "desc";
      const sm = document.createElement("summary"); sm.textContent = "声の説明（ElevenLabs に渡している文）";
      const p = document.createElement("p"); p.textContent = c.el_description || "";
      desc.append(sm, p);
      sec.append(head, desc);
      {
        const seen = new Map();
        for (const it of linesFor(key)) { const id = it.cardId || it.ref; const no = cardNo(id); if (/^\d{3}$/.test(no) && !seen.has(no)) seen.set(no, [id, it.card]); }
        if (seen.size) { const cards = el("div", "cards"); for (const [id, title] of seen.values()) cards.append(cardThumb(id, title)); sec.append(cards); }
      }
      // 候補
      if (cands.length) {
        const grid = document.createElement("div"); grid.className = "grid";
        for (const cand of cands) {
          const box = document.createElement("div"); box.className = "cand" + (r.choice === cand.choice && r.voiceId ? " chosen" : "");
          const top = document.createElement("div"); top.className = "cand-top";
          const b = document.createElement("b"); b.textContent = "候補" + cand.choice + (r.choice === cand.choice && r.voiceId ? "（登録中）" : "");
          const btns = document.createElement("div"); btns.className = "btns";
          const btn = document.createElement("button"); btn.type = "button"; btn.className = "copy"; btn.textContent = "この候補に決める";
          btn.addEventListener("click", () => copy(`${TOOL} pick --cast ${key} --choice ${cand.choice}`));
          // 登録が成功したときだけ続けて台詞を作る（PowerShell 5.1 は && が使えないので if ($?) でつなぐ）
          const both = document.createElement("button"); both.type = "button"; both.className = "copy main"; both.textContent = "決めて台詞まで作る";
          both.addEventListener("click", () => copy(`${TOOL} pick --cast ${key} --choice ${cand.choice}; if ($?) { ${TOOL} lines --cast ${key} }`));
          btns.append(btn, both);
          top.append(b, btns);
          const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.src = "/" + enc("voices/cards/previews/" + cand.file) + bust();
          box.append(top, au); grid.append(box);
        }
        const more = document.createElement("button"); more.type = "button"; more.className = "copy"; more.textContent = "候補を追加で作るコマンドをコピー";
        more.addEventListener("click", () => copy(`${TOOL} design --cast ${key} --keep`));
        sec.append(grid, more);
      } else {
        const btn = document.createElement("button"); btn.type = "button"; btn.className = "copy"; btn.textContent = "候補を作るコマンドをコピー";
        btn.addEventListener("click", () => copy(`${TOOL} design --cast ${key}`));
        sec.append(btn);
      }
      // 作った台詞
      if (r.voiceId) {
        const list = document.createElement("div"); list.className = "lines-list";
        const items = linesFor(key);
        let made = 0;
        for (const it of items) {
          const url = "/voices/cards/" + encodeURIComponent(it.ref) + ".mp3";
          const row = document.createElement("div"); row.className = "line-row";
          const t = document.createElement("div");
          const spoken = document.createElement("span"); spoken.className = "spoken";
          const orig = document.createElement("small"); orig.className = "orig";
          t.append(spoken, orig);
          const small = document.createElement("small"); small.textContent = `${it.card}｜${it.field}｜${it.ref}`;
          const dirLabel = document.createElement("span"); dirLabel.className = "dir-tag"; dirLabel.textContent = describe(it.ref); small.append(dirLabel); t.append(small);
          const holder = document.createElement("div"); holder.className = "missing"; holder.textContent = "確認中…";
          const refresh = () => showLine(it, spoken, orig, dirLabel); refresh();
          const panel = fixPanel(it, refresh);
          const act = document.createElement("button"); act.type = "button"; act.className = "copy small"; act.textContent = "直す・作り直す"; act.setAttribute("aria-expanded", "false");
          act.addEventListener("click", () => { panel.hidden = !panel.hidden; act.setAttribute("aria-expanded", String(!panel.hidden)); act.textContent = panel.hidden ? "直す・作り直す" : "閉じる"; });
          const acts = document.createElement("div"); acts.className = "line-acts"; acts.append(act);
          row.append(cardThumb(it.cardId || it.ref, it.card), t, holder, acts, panel); list.append(row);
          exists(url).then(ok => {
            if (ok) { made++; const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.src = url + bust(); holder.replaceWith(au); }
            else holder.textContent = "未作成";
          });
        }
        const btn = document.createElement("button"); btn.type = "button"; btn.className = "copy"; btn.textContent = "台詞を作るコマンドをコピー";
        btn.addEventListener("click", () => copy(`${TOOL} lines --cast ${key}`));
        const h = document.createElement("div"); h.className = "labels"; h.textContent = data.items ? "作った台詞" : "作った台詞（複数人の台詞は番号付きのファイルなので、ここでは表示されません）";
        sec.append(h, btn, list);
      }
      frag.append(sec);
    }
    $("list").replaceChildren(frag);
    if (!shown) $("list").replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: show === "active" ? "まだ候補を作ったキャストがありません。「表示：すべてのキャスト」で一覧を見られます。" : "該当するキャストがありません。" }));
    $("summary").textContent = `キャスト${keys.length}人｜候補あり${withCand}人｜声を登録済み${withVoice}人`;
  }

  async function load() {
    const [cast, record, script, pairs, list, dirs] = await Promise.all([
      getJson("/tools/voice-script/card_voice_cast.json", { cast: {} }),
      getJson("/voices/cards/voices.json", {}),
      getJson("/tools/voice-script/card_voice_script.json", { lines: {} }),
      getJson("/tools/voice-script/card_voice_pairs.json", { pairs: {} }),
      getJson("/tools/voice-script/card_voice_lines.json", null),
      getJson("/__dev/voice-direction", { directions: {} }),
    ]);
    data = { cast: cast.cast || {}, record, lines: script.lines || {}, pairs: pairs.pairs || {}, items: list && list.items, directions: dirs.directions || {} };
    await render();
  }
  $("viewer").addEventListener("click", () => $("viewer").close());
  $("q").addEventListener("input", render);
  $("show").addEventListener("change", render);
  $("reload").addEventListener("click", () => { load(); toast("最新の状態に更新しました"); });
  load();
})();
</script>
</body>
</html>
