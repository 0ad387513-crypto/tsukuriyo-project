<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- カードボイスの確認ページ（ローカル専用。npm run preview 中に http://localhost:8765/tools/voice-preview/ で開く。本番では _redirects で404）。
     voices/cards/voices.json（候補・登録状況）と tools/voice-script/card_voice_cast.json（キャスト）を読み、
     候補（voices/cards/previews/）と作った台詞（voices/cards/）を再生する。登録などの操作はボタンから確認用サーバー（/__dev/voice-run）経由で実行する -->
<title>カードボイス 試聴室</title>
<style>
  :root {
    --bg: #12172a; --panel: #1a2133; --line: #323b54; --ink: #ece6d6; --muted: #9aa3b8;
    --gold: #e3bf6e; --gold-soft: #3a3324; --ok: #7fd3a0; --ok-soft: #1f3a2b; --focus: #8fb0f0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 60px; }
  h1 { font-family: "Shippori Mincho", "Yu Mincho", serif; font-size: 28px; margin: 0 0 6px; letter-spacing: .04em; }
  .lead { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
  .bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .bar input[type=search] { font: inherit; flex: 1 1 220px; min-width: 0; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .bar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .bar select, .bar button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .summary { font-size: 13px; color: var(--muted); }
  .bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .bar-foot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  .bar .tab { font: inherit; font-size: 14px; font-weight: 700; padding: 6px 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
  .tab small { font-weight: 400; font-size: 11px; margin-left: 4px; }
  .cast-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-height: 108px; overflow-y: auto; }
  .bar .ctab { font: inherit; width: max-content; flex: none; font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ctab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .ctab.cand::before { background: var(--gold); }
  .ctab.done::before { background: var(--ok); }
  .ctab[aria-selected="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); font-weight: 700; }
  .ctab.all { color: var(--muted); }
  .ctab.all::before { display: none; }
  .tab:focus-visible, .ctab:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .legend { font-size: 11px; color: var(--muted); }
  .vol { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .vol input { width: 160px; accent-color: var(--gold); }
  .vol output { min-width: 2.5em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cast { border-top: 1px solid var(--line); padding-block: 16px; display: grid; gap: 10px; }
  .cast-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
  .cast-name { font-family: "Shippori Mincho", "Yu Mincho", serif; font-size: 20px; font-weight: 700; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
  .chip.done { background: var(--ok-soft); color: var(--ok); }
  .labels { font-size: 12px; color: var(--muted); }
  details.voice-edit { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  details.voice-edit > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--gold); }
  details.voice-edit[open] > summary { margin-bottom: 10px; }
  .ve { display: grid; gap: 12px; }
  .ve textarea { font: inherit; font-size: 13px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; width: 100%; }
  .ve textarea:focus-visible, .ve input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .ve input[type=text] { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); flex: 1 1 260px; min-width: 0; }
  .spec-label { font-size: 12px; color: var(--muted); min-width: 9em; }
  .count { font-size: 11px; color: var(--muted); justify-self: end; }
  .count.over { color: #ff9fa8; font-weight: 700; }
  .history { display: grid; gap: 6px; }
  .history-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
  .cand-select { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .cand-select input { accent-color: var(--gold); width: 16px; height: 16px; }
  .cand.picked { border-color: #ff9fa8; }
  .copy.danger { border-color: #ff9fa8; background: #4a2228; color: #ff9fa8; }
  .cand-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cand-desc summary { font-size: 11px; color: var(--muted); cursor: pointer; }
  .cand-desc p { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
  details.desc summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  details.desc p { font-size: 12px; color: var(--muted); margin: 6px 0 0; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .cand { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
  .cand.chosen { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .cand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cand-top b { font-size: 14px; }
  audio { width: 100%; height: 36px; }
  .copy { font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold-soft); color: var(--gold); cursor: pointer; white-space: nowrap; }
  .copy:focus-visible, .bar button:focus-visible, .bar select:focus-visible, .bar input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .lines-list { display: grid; gap: 6px; }
  .line-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 10px; align-items: center; font-size: 14px; }
  .line-row small { color: var(--muted); display: block; font-size: 11px; }
  .missing { color: var(--muted); font-size: 12px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .copy.main { background: var(--gold); color: var(--bg); }
  .copy.small { font-size: 11px; padding: 3px 8px; font-weight: 400; }
  .line-row { grid-template-columns: 52px minmax(0, 1fr) minmax(220px, 300px) auto; }
  @media (max-width: 640px) { .line-row { grid-template-columns: 52px minmax(0, 1fr); } .line-row > :nth-child(n+3) { grid-column: 1 / -1; } }
  .thumb { width: 52px; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); cursor: zoom-in; padding: 0; display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; display: block; }
  .thumb:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .cards .thumb { width: 84px; }
  .viewer { border: 0; padding: 0; background: transparent; max-width: min(92vw, 520px); max-height: 92vh; }
  .viewer::backdrop { background: rgba(0, 0, 0, .75); }
  .viewer img { display: block; width: 100%; height: auto; max-height: 86vh; object-fit: contain; border-radius: 10px; cursor: zoom-out; }
  .viewer p { margin: 6px 0 0; text-align: center; color: #fff; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; }
  .runner { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: grid; gap: 6px; }
  .runner[hidden] { display: none; }
  .runner.ok { border-color: var(--ok); }
  .runner.ng { border-color: #ff9fa8; }
  .runner-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .runner-actions { display: flex; gap: 6px; }
  .runner-msg { margin: 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .runner-msg:empty { display: none; }
  .runner-log { margin: 0; max-height: 180px; overflow: auto; font-family: Consolas, "Courier New", monospace; font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 30px 0; }
  .line-acts { display: flex; gap: 6px; }
  .dir-tag { font-size: 11px; color: var(--gold); margin-left: 6px; }
  .multi { margin-top: 6px; padding: 6px 8px; border-radius: 8px; border: 1px dashed var(--gold); background: var(--gold-soft); display: grid; gap: 2px; font-size: 12px; }
  .multi-head { font-weight: 700; color: var(--gold); font-size: 11px; }
  .multi-part { color: var(--muted); }
  .multi-part.me { color: var(--ink); font-weight: 700; }
  .pair { margin-top: 6px; display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  .pair .thumb { width: 40px; flex: none; }
  .pair-body { min-width: 0; display: grid; gap: 2px; font-size: 12px; }
  .pair-kind { justify-self: start; font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; }
  .pair-kind.rival { background: #4a2228; color: #ff9fa8; }
  .pair-kind.ally { background: #1f3a2b; color: #7fd3a0; }
  .pair-who { color: var(--ink); }
  .pair-other { color: var(--muted); }
  .dir { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .dir[hidden] { display: none; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .preset[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
  .dir-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .dir-row input, .dir-row select { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .dir-row input { flex: 1 1 220px; min-width: 0; }
  .dir-note { font-size: 11px; color: var(--muted); margin: 0; white-space: pre-line; }
  .dir { gap: 12px; }
  .step { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .step:last-child { border-bottom: 0; padding-bottom: 0; }
  .step h4 { margin: 0; font-size: 13px; color: var(--gold); }
  .step textarea { font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; width: 100%; }
  .step textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .step > .copy.small { justify-self: start; }
  .orig { color: var(--muted); }
  .orig[hidden] { display: none; }
  details.adv summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  details.adv .dir-row { margin-top: 6px; }
  .cmd { display: block; font-family: Consolas, "Courier New", monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; overflow-wrap: anywhere; user-select: all; }
  .preset:focus-visible, .dir-row input:focus-visible, .dir-row select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>カードボイス 試聴室</h1>
  <p class="lead">声の候補と、作った台詞を聴いて確認するページです。上のタブで種族とキャストを選びます。「この候補に決める」「台詞を作る」などのボタンを押すと、その場で ElevenLabs で作ります（PowerShell は使いません）。進み具合は画面の下に出て、終わると一覧が最新になります。台詞の「直す・作り直す」から、台詞の言い換えと演技の方針を台詞ごとに指定できます。指定はこのPCの確認用サーバーにだけ保存されます。</p>
  <div class="bar">
    <div class="tabs" role="tablist" aria-label="種族" id="tribes"></div>
    <div class="cast-tabs" role="tablist" aria-label="キャスト" id="castTabs"></div>
    <div class="bar-foot"><button type="button" id="reload">最新の状態に更新</button><label class="vol" for="volume">音量 <input type="range" id="volume" min="0" max="100" step="5" value="80"> <output id="volumeText" for="volume">80</output></label><span class="summary" id="summary"></span></div>
  </div>
  <main id="list"><div class="empty">読み込んでいます…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section class="runner" id="runner" hidden aria-live="polite">
  <div class="runner-head"><b id="runnerTitle">実行中…</b><span class="runner-actions"><button type="button" class="copy small" id="runnerCopy">コマンドをコピー</button><button type="button" class="copy small" id="runnerClose">閉じる</button></span></div>
  <p class="runner-msg" id="runnerMsg"></p>
  <pre class="runner-log" id="runnerLog"></pre>
</section>
<dialog class="viewer" id="viewer" aria-label="カードの拡大表示"><img id="viewerImg" alt=""><p id="viewerCap"></p></dialog>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOOL = "node scripts/generate_card_voices_elevenlabs.js";
  let data = { cast: {}, record: {}, lines: {}, pairs: {}, items: null, directions: {} };
  // 演技の指定。ElevenLabs の演技タグ（英語の [ ] 書き）を台詞の頭に付けて読ませる。1〜2個までが自然
  const PRESETS = ["戦闘中の掛け声として", "敵に斬りかかる瞬間", "攻撃を受けて", "倒れる間際に", "はきはきと", "明るく元気に", "落ち着いて", "力強く", "ささやくように", "悲しげに", "怒りをこめて", "笑いながら", "叫びすぎない"];
  const STABILITY = [["", "標準（共通の設定 0.5）"], ["0", "0：表情を大きく（ぶれやすい）"], ["0.5", "0.5：自然"], ["1", "1：安定（平板になりやすい）"]];
  async function saveDirection(ref, body) {
    const r = await fetch("/__dev/voice-direction?ref=" + encodeURIComponent(ref), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.message || "保存できませんでした");
    if (j.direction) data.directions[ref] = j.direction; else delete data.directions[ref];
  }
  // 台詞の行の表示を、保存した指定に合わせて更新する
  // 2人以上で話す台詞（台本の 名前「…」名前「…」 や「2人同時に」で分かれたもの）
  const MULTI_SYNTAX = /[^「」\s]+「[^」]*」/;
  const partsOf = it => (data.items || []).filter(i => i.group === (it.group || it.ref));
  const isMulti = it => partsOf(it).length > 1;
  function scriptOf(it) {
    if (it.script) return it.script;
    const m = /^([np]\d+)-([a-z]+)$/.exec(it.group || it.ref);
    if (m) { const src = m[1][0] === "n" ? data.lines[m[1]] : data.pairs[m[1]]; if (src && src[m[2]]) return src[m[2]]; }
    return it.text;
  }
  // 実際に読み上げる文（その台詞だけの言い換えがあればそれ）
  const spokenOf = i => (data.directions[i.ref] || {}).text || i.text;
  function multiBox(it) {
    const parts = partsOf(it);
    if (parts.length < 2) return null;
    const box = el("div", "multi");
    const together = parts.every(p => p.together);
    box.append(el("span", "multi-head", parts.length + "人をまたぐ台詞（" + (together ? "同時に話す" : "順番に話す") + "）"));
    parts.forEach((p, i) => {
      const who = p.speaker || displayName(p.cast);
      box.append(el("span", "multi-part" + (p.ref === it.ref ? " me" : ""), (i + 1) + ". " + who + "「" + spokenOf(p) + "」" + (p.ref === it.ref ? "　← この台詞" : "")));
    });
    return box;
  }
  function showLine(it, spoken, orig, label) {
    const d = data.directions[it.ref] || {};
    spoken.textContent = d.text || it.text;
    orig.textContent = d.text ? "台本の文：" + it.text : "";
    orig.hidden = !d.text;
    label.textContent = describe(it.ref);
  }
  function describe(ref) {
    const d = data.directions[ref];
    if (!d) return "";
    return [d.text ? "読み替えあり" : "", d.direction ? "方針「" + (d.direction.length > 24 ? d.direction.slice(0, 24) + "…" : d.direction) + "」" : "", d.tags ? "タグ " + d.tags : "", d.stability !== undefined ? "安定度" + d.stability : ""].filter(Boolean).join("・");
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  // 入力欄の「例：…」の文をそのまま入れるボタン
  function exampleButton(input) {
    const b = el("button", "copy small", "例を入れる"); b.type = "button";
    b.title = input.placeholder;
    b.addEventListener("click", () => {
      input.value = input.placeholder.replace(/^例：/, "");
      input.dispatchEvent(new Event("input"));
      input.focus();
    });
    return b;
  }
  function fixPanel(it, refresh) {
    const cur = data.directions[it.ref] || {};
    const cmd = TOOL + " lines --ref " + (isMulti(it) ? (it.group || it.ref) : it.ref) + " --force";
    const box = el("div", "dir"); box.hidden = true;

    // ① 台詞を変える。複数人の台詞は台詞全体（名前「…」名前「…」）を編集する
    const multi = isMulti(it);
    const groupRef = it.group || it.ref;
    const original = (() => { const d = data.directions[groupRef] || {}; return d.script ? null : scriptOf(it); })();
    const s1 = el("section", "step");
    const text = el("textarea"); text.rows = 2; text.setAttribute("aria-label", "台詞");
    text.value = multi || (data.directions[groupRef] || {}).script ? scriptOf(it) : (cur.text || it.text);
    const kind = el("p", "dir-note");
    const syncKind = () => {
      const v = text.value.trim();
      kind.textContent = MULTI_SYNTAX.test(v)
        ? "名前「…」の形なので、話す人ごとに分けて作ります（" + [...v.matchAll(/([^「」\s]+)「/g)].map(m => m[1]).join(" → ") + "）。"
        : "1人の台詞として、この文を読み上げます。";
    };
    text.addEventListener("input", syncKind); syncKind();
    const reset = el("button", "copy small", "台本の文に戻す"); reset.type = "button";
    reset.addEventListener("click", () => {
      const m = /^([np]\d+)-([a-z]+)$/.exec(groupRef); const src = m && (m[1][0] === "n" ? data.lines[m[1]] : data.pairs[m[1]]);
      text.value = multi || (data.directions[groupRef] || {}).script ? ((src && src[m[2]]) || scriptOf(it)) : it.text; syncKind();

  // 台本から、キャストごとの台詞（台詞ID・本文）を組み立てる（ツールと同じ規則の簡易版：作った音声ファイルの有無で確認）
  function linesFor(key) {
    // cast を実行すると作られる一覧があれば、それで正確に並べる（複数人の台詞も1人分ずつ出る）
    if (data.items) {
      const field = ref => ({ summon: "召喚時", attack: "攻撃時", death: "死亡時", use: "使用時", line: "掛け合い", reply: "返し" })[ref.split("-")[1]] || "";
      return data.items.filter(i => i.cast === key).map(i => ({ ref: i.ref, card: (data.lines[i.cardId] || {}).card || i.card, field: field(i.ref) + (i.ref !== i.group ? "（" + (i.together ? "同時" : "複数人") + "）" : ""), text: i.text, cardId: i.cardId, group: i.group, script: i.script, overridden: i.overridden }));
    }
    const out = [];
    const c = data.cast[key] || {};
    for (const [id, l] of Object.entries(data.lines)) {
      for (const f of ["summon", "attack", "death", "use"]) if (l[f]) out.push({ ref: `${id}-${f}`, card: l.card, field: { summon: "召喚時", attack: "攻撃時", death: "死亡時", use: "使用時" }[f], text: l[f], speaker: l.speaker });
    }
    for (const [id, p] of Object.entries(data.pairs)) {
      if (p.line) out.push({ ref: `${id}-line`, card: p.whoCard, field: "掛け合い", text: p.line, speaker: p.whoSpeaker });

    const base = key.replace(/[:（].*$/, "");

  // 種族のタブ。オラクル・レリックだけに出るキャストは「その他」。「作業中」は候補か声があるキャスト
  const TRIBES = ["忍者", "侍", "人獣", "神使", "妖怪", "龍"];

  $("viewer").addEventListener("click", () => $("viewer").close());

  const VOLUME_KEY = "voicePreview.volume";

  $("reload").addEventListener("click", async () => { rememberScroll(); await load(); restoreScroll(); toast("最新の状態に更新しました"); });
  const SCROLL_KEY = "voicePreview.scroll";

    try { saved = JSON.parse(sessionStorage.getItem(SCROLL_KEY) || "null"); } catch (e) {}
    if (!saved) return;
    const target = saved.anchor && [...document.querySelectorAll("[data-anchor]")].find(e => e.dataset.anchor === saved.anchor);
    if (target) scrollTo(0, scrollY + target.getBoundingClientRect().top - saved.offset);
    else scrollTo(0, saved.y || 0);
  }
  let scrollTimer = 0;
  addEventListener("scroll", () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(rememberScroll, 150); }, { passive: true });
  addEventListener("pagehide", rememberScroll);
  // 選んでいたタブも元に戻してから並べる
  try {
    const saved = JSON.parse(sessionStorage.getItem(SCROLL_KEY) || "null");
    if (saved && saved.tribe) view = { tribe: saved.tribe, cast: saved.cast || null };
  } catch (e) {}
  load().then(() => setTimeout(restoreScroll, 0));
})();
</script>
</body>
</html>
